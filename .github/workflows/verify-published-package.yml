name: Verify deployed Simulation package
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Immutable already-published release tag
        required: true
        type: string
      tested_run_id:
        description: Successful pull request run containing the tested package
        required: true
        type: string
      artifact_name:
        description: Vendordep artifact from the tested run
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  verify-public:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.release_tag }}
          fetch-depth: 0
      # Keep the verifier on the dispatched workflow revision while validating
      # package scripts and source from the immutable release tag.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          path: build/verification-tools
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ inputs.artifact_name }}
          path: build/vendor-maven
          run-id: ${{ inputs.tested_run_id }}
          github-token: ${{ github.token }}
      - name: Verify tested package and release tag
        env:
          GH_TOKEN: ${{ github.token }}
          TESTED_RUN_ID: ${{ inputs.tested_run_id }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          ARTIFACT_NAME: ${{ inputs.artifact_name }}
        run: |
          python3 .github/release/validate_tested_release.py --run-id "$TESTED_RUN_ID" --release-tag "$RELEASE_TAG" --package build/vendor-maven --artifact-name "$ARTIFACT_NAME"
          python3 scripts/verify_vendordep.py --maven-root build/vendor-maven/maven
      - name: Verify public bytes against the tested package
        run: python3 build/verification-tools/scripts/verify_deployed_vendordep.py --site-url https://meco-robotics.github.io/MecoSimulation-cpp --expected-package build/vendor-maven
  deployed-warm-dependencies:
    needs: verify-public
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
        configuration: [Debug, Release]
        base:
          - {ref: v2026.2.12, version: '2026.2.12'}
          - {ref: v2026.2.15, version: '2026.2.15'}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.release_tag }}
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: MECO-Robotics/MecoBase-cpp
          ref: ${{ matrix.base.ref }}
          path: MecoBase-cpp
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@7defe9254715b088f12dddd9942945a3d75cdad5
        if: runner.os == 'Windows'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        if: runner.os == 'Windows'
        with:
          name: base-windows-vendor-cache
          path: MecoBase-cpp/build/vendor-cache/
          run-id: ${{ inputs.tested_run_id }}
          github-token: ${{ github.token }}
      - name: Configure Windows vendor cache
        if: runner.os == 'Windows'
        shell: bash
        run: |
          python MecoBase-cpp/scripts/prepare_vendor_cache.py --output MecoBase-cpp/build/vendor-cache --verify-only
          echo "FRC_VENDOR_CACHE=$(cygpath -m "$(pwd)/MecoBase-cpp/build/vendor-cache")" >> "$GITHUB_ENV"
      - name: Resolve deployed dependencies (not validation)
        env:
          BASE_VERSION: ${{ matrix.base.version }}
        shell: bash
        run: python scripts/consumer_smoke.py --target desktop --configuration '${{ matrix.configuration }}' --published --meco-base-root MecoBase-cpp --expected-base-version "$BASE_VERSION" --warm-dependencies

      - uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/caches/8.11/transforms
            ~/.gradle/permwrapper/dists
          key: sim-deployed-${{ github.run_id }}-attempt-${{ github.run_attempt }}-${{ matrix.os }}-${{ matrix.configuration }}-${{ matrix.base.version }}

  deployed-consumer:
    needs: [verify-public, deployed-warm-dependencies]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
        configuration: [Debug, Release]
        base:
          - {ref: v2026.2.12, version: '2026.2.12'}
          - {ref: v2026.2.15, version: '2026.2.15'}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.release_tag }}
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: MECO-Robotics/MecoBase-cpp
          ref: ${{ matrix.base.ref }}
          path: MecoBase-cpp
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@7defe9254715b088f12dddd9942945a3d75cdad5
        if: runner.os == 'Windows'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        if: runner.os == 'Windows'
        with:
          name: base-windows-vendor-cache
          path: MecoBase-cpp/build/vendor-cache/
          run-id: ${{ inputs.tested_run_id }}
          github-token: ${{ github.token }}
      - name: Configure Windows vendor cache
        if: runner.os == 'Windows'
        shell: bash
        run: |
          python MecoBase-cpp/scripts/prepare_vendor_cache.py --output MecoBase-cpp/build/vendor-cache --verify-only
          echo "FRC_VENDOR_CACHE=$(cygpath -m "$(pwd)/MecoBase-cpp/build/vendor-cache")" >> "$GITHUB_ENV"
      - uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/caches/8.11/transforms
            ~/.gradle/permwrapper/dists
          key: sim-deployed-${{ github.run_id }}-attempt-${{ github.run_attempt }}-${{ matrix.os }}-${{ matrix.configuration }}-${{ matrix.base.version }}
          fail-on-cache-miss: true
      - name: Link deployed consumer
        env:
          BASE_VERSION: ${{ matrix.base.version }}
        shell: bash
        run: python scripts/consumer_smoke.py --target desktop --configuration '${{ matrix.configuration }}' --published --meco-base-root MecoBase-cpp --expected-base-version "$BASE_VERSION" --offline

  verify-deployed-job-deadlines:
    if: always()
    needs: [deployed-warm-dependencies, deployed-consumer]
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.release_tag }}
      - name: Verify all deployed consumer deadlines
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/validate_job_deadlines.py

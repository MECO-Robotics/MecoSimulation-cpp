name: Publish tested Simulation package
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Immutable release tag
        required: true
        type: string
      tested_run_id:
        description: Successful pull request run containing the tested package
        required: true
        type: string
      artifact_name:
        description: Vendordep artifact from the tested run
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ inputs.artifact_name }}
          path: build/vendor-maven
          run-id: ${{ inputs.tested_run_id }}
          github-token: ${{ github.token }}
      - name: Verify tested package and release tag
        env:
          GH_TOKEN: ${{ github.token }}
          TESTED_RUN_ID: ${{ inputs.tested_run_id }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          ARTIFACT_NAME: ${{ inputs.artifact_name }}
        run: |
          python3 .github/release/validate_tested_release.py --run-id "$TESTED_RUN_ID" --release-tag "$RELEASE_TAG" --package build/vendor-maven --artifact-name "$ARTIFACT_NAME"
          python3 scripts/verify_vendordep.py --maven-root build/vendor-maven/maven
      - name: Preserve previously published Maven coordinates
        run: python3 scripts/merge_maven_pages.py --new-root build/vendor-maven --output build/pages-site --existing-site-url https://meco-robotics.github.io/MecoSimulation-cpp
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: build/pages-site/
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
        id: deployment
  verify-deployment:
    needs: publish
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: python3 scripts/verify_deployed_vendordep.py --site-url '${{ needs.publish.outputs.page_url }}'
  deployed-consumer:
    needs: [publish, verify-deployment]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
        configuration: [Debug, Release]
        base:
          - {ref: v2026.2.5, version: '2026.2.5'}
          - {ref: v2026.2.10, version: '2026.2.10'}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.release_tag }}
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: MECO-Robotics/MecoBase-cpp
          ref: ${{ matrix.base.ref }}
          path: MecoBase-cpp
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@7defe9254715b088f12dddd9942945a3d75cdad5
        if: runner.os == 'Windows'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        if: runner.os == 'Windows'
        with:
          name: base-windows-vendor-cache
          path: MecoBase-cpp/build/vendor-cache/
          run-id: ${{ inputs.tested_run_id }}
          github-token: ${{ github.token }}
      - name: Configure Windows vendor cache
        if: runner.os == 'Windows'
        shell: bash
        run: |
          python MecoBase-cpp/scripts/prepare_vendor_cache.py --output MecoBase-cpp/build/vendor-cache --verify-only
          echo "FRC_VENDOR_CACHE=$(cygpath -m "$(pwd)/MecoBase-cpp/build/vendor-cache")" >> "$GITHUB_ENV"
      - name: Link deployed consumer
        env:
          BASE_VERSION: ${{ matrix.base.version }}
        shell: bash
        run: python scripts/consumer_smoke.py --target desktop --configuration '${{ matrix.configuration }}' --published --meco-base-root MecoBase-cpp --expected-base-version "$BASE_VERSION"

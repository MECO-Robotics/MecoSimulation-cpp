name: Publish locally built Simulation package
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Tag whose release contains the locally built vendordep.zip
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: meco-simulation-pages-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.release_tag }}
      - name: Download and verify local package
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          python3 scripts/verify_release_tag.py --git-ref "refs/tags/$RELEASE_TAG"
          gh release download "$RELEASE_TAG" --pattern vendordep.zip --dir "$RUNNER_TEMP"
          python3 scripts/local_release_bundle.py unpack --bundle "$RUNNER_TEMP/vendordep.zip" --package build/vendor-maven
          python3 scripts/verify_vendordep.py --maven-root build/vendor-maven/maven
      - name: Retain published Maven coordinates
        run: python3 scripts/merge_maven_pages.py --new-root build/vendor-maven --output build/pages-site --existing-site-url https://meco-robotics.github.io/MecoSimulation-cpp
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: build/pages-site/
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
        id: deployment
  verify-public:
    if: ${{ !contains(inputs.release_tag, '-') }}
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.release_tag }}
      - name: Compare public release to the local bundle
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          gh release download "$RELEASE_TAG" --pattern vendordep.zip --dir "$RUNNER_TEMP"
          python3 scripts/local_release_bundle.py unpack --bundle "$RUNNER_TEMP/vendordep.zip" --package build/vendor-maven
          python3 scripts/verify_deployed_vendordep.py --site-url '${{ needs.publish.outputs.page_url }}' --expected-package build/vendor-maven
  public-consumer:
    if: ${{ !contains(inputs.release_tag, '-') }}
    needs: verify-public
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
        base:
          - {ref: v2026.2.12, version: '2026.2.12'}
          - {ref: v2026.2.15, version: '2026.2.15'}
          - {ref: v2026.2.17-beta.1, version: '2026.2.17-beta.1'}
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.release_tag }}
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: MECO-Robotics/MecoBase-cpp
          ref: ${{ matrix.base.ref }}
          path: MecoBase-cpp
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: '17'
      - name: Link public consumer
        shell: bash
        run: python scripts/consumer_smoke.py --target desktop --configuration '${{ matrix.configuration }}' --published --meco-base-root MecoBase-cpp --expected-base-version '${{ matrix.base.version }}'
